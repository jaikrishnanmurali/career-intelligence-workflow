# Install this only in the root of a private Career Ops repository.
name: Scheduled Career Intelligence digest

on:
  schedule:
    - cron: "23 7,19 * * *"
      timezone: "UTC"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: career-intelligence-digest
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run:
        working-directory: extensions/career-intelligence-workflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked extension dependencies
        run: npm ci

      - name: Validate Career Ops and the private digest profile
        run: npm run doctor -- --deploy --career-ops-root ../..

      - name: Run extension tests
        run: npm test

      - name: Scan and send the digest
        run: node src/run.mjs --send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CAREER_DIGEST_FROM: ${{ secrets.CAREER_DIGEST_FROM }}
          CAREER_DIGEST_TO: ${{ secrets.CAREER_DIGEST_TO }}
          ATS_BOARDS_PER_SOURCE: "400"
          MAX_SCAN_MINUTES: "18"
          MAX_PAGE_VERIFICATIONS: "60"

      - name: Save private recommendation state
        working-directory: .
        run: |
          git config user.name "career-intelligence-bot"
          git config user.email "career-intelligence-bot@users.noreply.github.com"
          git add -f extensions/career-intelligence-workflow/state/state.json
          git add -f extensions/career-intelligence-workflow/reports/latest.json
          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "chore: save Career Intelligence state"
            git push
          fi
