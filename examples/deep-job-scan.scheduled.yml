# Install this only in the root of a private Career Ops repository.
name: Scheduled Career Intelligence digest

on:
  schedule:
    - cron: "23 7 * * *"
      timezone: "UTC"
    - cron: "43 7 * * *"
      timezone: "UTC"
    - cron: "3 8 * * *"
      timezone: "UTC"
    - cron: "23 19 * * *"
      timezone: "UTC"
    - cron: "43 19 * * *"
      timezone: "UTC"
    - cron: "3 20 * * *"
      timezone: "UTC"
  workflow_dispatch:
    inputs:
      mode:
        description: Run a scan or only validate the delivery guard
        required: true
        default: run
        type: choice
        options:
          - run
          - guard-only

permissions:
  contents: write

concurrency:
  group: career-intelligence-digest
  cancel-in-progress: false
  queue: max

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run:
        working-directory: extensions/career-intelligence-workflow
    steps:
      - name: Check out the latest saved scan state
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked extension dependencies
        run: npm ci

      - name: Decide whether this attempt should run
        id: gate
        run: node src/schedule-guard.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_MODE: ${{ inputs.mode || 'run' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          MINIMUM_GAP_HOURS: "6"

      - name: Validate Career Ops and the private digest profile
        if: steps.gate.outputs.should_run == 'true'
        run: npm run doctor -- --deploy --career-ops-root ../..

      - name: Run extension tests
        if: steps.gate.outputs.should_run == 'true'
        run: npm test

      - name: Scan and send the digest
        if: steps.gate.outputs.should_run == 'true'
        run: node src/run.mjs --send --slot "${{ steps.gate.outputs.slot_id }}"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CAREER_DIGEST_FROM: ${{ secrets.CAREER_DIGEST_FROM }}
          CAREER_DIGEST_TO: ${{ secrets.CAREER_DIGEST_TO }}
          ATS_BOARDS_PER_SOURCE: "400"
          MAX_SCAN_MINUTES: "18"
          MAX_PAGE_VERIFICATIONS: "60"

      - name: Save private recommendation state
        if: steps.gate.outputs.should_run == 'true'
        working-directory: .
        run: |
          git config user.name "career-intelligence-bot"
          git config user.email "career-intelligence-bot@users.noreply.github.com"
          git add -f extensions/career-intelligence-workflow/state/state.json
          git add -f extensions/career-intelligence-workflow/reports/latest.json
          if git diff --cached --quiet; then
            echo "No state changes to save."
          else
            git commit -m "chore: save Career Intelligence state"
            git push
          fi

      - name: Record guard decision
        if: always()
        run: echo "${{ steps.gate.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
