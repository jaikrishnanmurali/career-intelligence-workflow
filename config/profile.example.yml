# Fictional starter used for tests and installation previews.
# The installer creates a separate private draft from Career Ops.
version: 1
configured: false

career_ops:
  source: ../../config/profile.yml
  note: This public example contains no real candidate data.

search:
  lookback_hours: 12

  experience:
    core_years: 3
    total_years_including_adjacent: 6
    behavior: caution

  manager:
    prefer_individual_contributor: true
    title_penalty: 14
    people_management_penalty: 24
    low_fit_manager_floor: 64

  role_families:
    - id: customer-success
      label: Customer success
      priority: 4
      terms:
        - customer success
        - customer onboarding
        - client success
      responsibility_terms:
        - onboarding
        - adoption
        - customer journey
        - retention

    - id: community-operations
      label: Community operations
      priority: 3.2
      terms:
        - community operations
        - community specialist
        - member operations
      responsibility_terms:
        - community programs
        - member experience
        - program delivery

  title_excludes:
    - software engineer
    - data scientist
    - chief executive officer

  individual_contributor_title_signals:
    - specialist
    - coordinator
    - analyst

  location:
    home_group_id: ireland
    groups:
      - id: ireland
        label: Ireland
        score: 35
        terms:
          - ireland
          - dublin
          - cork
      - id: europe-remote
        label: Europe remote
        score: 18
        terms:
          - europe
          - european union
          - emea
          - remote
    obvious_out_of_scope_phrases:
      - united states only
      - canada only
    non_target_country_terms:
      - united states
      - canada
      - australia
    global_scope_signals:
      - worldwide
      - global
      - europe
      - emea
      - remote

  # A language is blocked only when the posting states it as mandatory.
  languages:
    exclude_when_hard_required:
      - german
      - french

discovery:
  welcome_to_the_jungle_queries:
    - customer success
    - customer onboarding
    - community operations

runtime:
  timezone: UTC
  request_timeout_ms: 12000
  ats_boards_per_source: 400
  max_scan_minutes: 18
  max_page_verifications: 60
