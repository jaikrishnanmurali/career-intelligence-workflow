# Fictional example profile. Copy this file to profile.yml and edit the copy.
# Keep profile.yml in a private repository.
version: 1

search:
  lookback_hours: 12

  # Experience is a ranking caution, never an automatic rejection.
  # "core" means directly relevant experience. "total" may include adjacent work.
  experience:
    core_years: 5
    total_years_including_adjacent: 7
    behavior: caution

  manager:
    prefer_individual_contributor: true
    title_penalty: 14
    people_management_penalty: 24
    low_fit_manager_floor: 64

  role_families:
    - id: product-partner-marketing
      label: Product / partner marketing
      priority: 4
      terms:
