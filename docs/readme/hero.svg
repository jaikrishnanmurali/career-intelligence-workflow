<svg width="1600" height="720" viewBox="0 0 1600 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Career Intelligence Workflow</title>
  <desc id="description">A visual flow from job discovery signals through filtering to a private email digest.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="20" x2="1510" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101C19"/>
      <stop offset="1" stop-color="#07100E"/>
    </linearGradient>
    <linearGradient id="signal" x1="1000" y1="130" x2="1400" y2="580" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A7F36B"/>
      <stop offset="1" stop-color="#65D6B2"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#D9F8E8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1600" height="720" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="720" rx="32" fill="url(#grid)"/>
  <path d="M0 606L1600 370" stroke="#A7F36B" stroke-opacity="0.09" stroke-width="150"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="72" width="270" height="40" rx="20" fill="#A7F36B"/>
    <text x="207" y="98" fill="#102019" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.7">CAREER OPS EXTENSION</text>

    <text x="72" y="212" fill="#F6F2E8" font-size="70" font-weight="800" letter-spacing="-2.6">YOUR JOB SEARCH.</text>
    <text x="72" y="294" fill="#F6F2E8" font-size="70" font-weight="800" letter-spacing="-2.6">STILL RUNNING.</text>

    <text x="76" y="365" fill="#B8C9C2" font-size="25">Twice-daily discovery, honest coverage and private email digests.</text>

    <g transform="translate(72 436)">
      <rect width="202" height="66" rx="10" fill="#172723" stroke="#416058"/>
      <circle cx="30" cy="33" r="8" fill="#A7F36B"/>
      <text x="50" y="29" fill="#81948D" font-size="14" font-weight="700" letter-spacing="1.4">DISCOVERY</text>
      <text x="50" y="49" fill="#F6F2E8" font-size="17" font-weight="700">0 model tokens</text>
    </g>
    <g transform="translate(290 436)">
      <rect width="180" height="66" rx="10" fill="#172723" stroke="#416058"/>
      <circle cx="30" cy="33" r="8" fill="#65D6B2"/>
      <text x="50" y="29" fill="#81948D" font-size="14" font-weight="700" letter-spacing="1.4">RUNS ON</text>
      <text x="50" y="49" fill="#F6F2E8" font-size="17" font-weight="700">GitHub Actions</text>
    </g>
    <g transform="translate(486 436)">
      <rect width="172" height="66" rx="10" fill="#172723" stroke="#416058"/>
      <circle cx="30" cy="33" r="8" fill="#F7B955"/>
      <text x="50" y="29" fill="#81948D" font-size="14" font-weight="700" letter-spacing="1.4">DELIVERS</text>
      <text x="50" y="49" fill="#F6F2E8" font-size="17" font-weight="700">through Resend</text>
    </g>

    <text x="76" y="614" fill="#70847C" font-size="17" font-weight="700" letter-spacing="2.2">SCAN  /  FILTER  /  VERIFY  /  DELIVER</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="895" y="92" width="606" height="536" rx="24" fill="#F5F0E5"/>
    <rect x="895" y="92" width="606" height="64" rx="24" fill="#E8E1D3"/>
    <path d="M895 132H1501" stroke="#C8BFAE"/>
    <circle cx="928" cy="124" r="7" fill="#E66B57"/>
    <circle cx="953" cy="124" r="7" fill="#E6B957"/>
    <circle cx="978" cy="124" r="7" fill="#78B977"/>
    <text x="1020" y="131" fill="#66716D" font-family="Arial, Helvetica, sans-serif" font-size="16">Career Intelligence &#183; morning digest</text>

    <text x="943" y="211" fill="#12221D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">3 roles worth checking</text>
    <rect x="943" y="235" width="508" height="1" fill="#D4CCBD"/>

    <g transform="translate(943 268)" font-family="Arial, Helvetica, sans-serif">
      <rect width="508" height="86" rx="13" fill="#FFFFFF" stroke="#D8D0C2"/>
      <rect x="16" y="17" width="53" height="24" rx="12" fill="#DFF6D2"/>
      <text x="42.5" y="34" fill="#315C25" font-size="12" font-weight="800" text-anchor="middle">FRESH</text>
      <text x="84" y="34" fill="#16251F" font-size="15" font-weight="800">Partner Marketing Specialist</text>
      <text x="84" y="59" fill="#6D7974" font-size="14">Stockholm &#183; employer ATS verified</text>
      <circle cx="475" cy="43" r="16" fill="#142620"/>
      <path d="M469 43H481M477 39L481 43L477 47" stroke="#A7F36B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(943 370)" font-family="Arial, Helvetica, sans-serif">
      <rect width="508" height="86" rx="13" fill="#FFFFFF" stroke="#D8D0C2"/>
      <rect x="16" y="17" width="72" height="24" rx="12" fill="#E0F1ED"/>
      <text x="52" y="34" fill="#286052" font-size="12" font-weight="800" text-anchor="middle">LIKELY</text>
      <text x="103" y="34" fill="#16251F" font-size="15" font-weight="800">Circularity Specialist</text>
      <text x="103" y="59" fill="#6D7974" font-size="14">Amsterdam &#183; posted today</text>
      <circle cx="475" cy="43" r="16" fill="#142620"/>
      <path d="M469 43H481M477 39L481 43L477 47" stroke="#A7F36B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(943 472)" font-family="Arial, Helvetica, sans-serif">
      <rect width="508" height="86" rx="13" fill="#FFFFFF" stroke="#D8D0C2"/>
      <rect x="16" y="17" width="114" height="24" rx="12" fill="#FFF0D3"/>
      <text x="73" y="34" fill="#7B5515" font-size="12" font-weight="800" text-anchor="middle">DISCOVERED</text>
      <text x="145" y="34" fill="#16251F" font-size="15" font-weight="800">Growth Operations Specialist</text>
      <text x="145" y="59" fill="#6D7974" font-size="14">Vienna &#183; timestamp unavailable</text>
      <circle cx="475" cy="43" r="16" fill="#142620"/>
      <path d="M469 43H481M477 39L481 43L477 47" stroke="#A7F36B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="943" y="585" width="194" height="22" rx="11" fill="url(#signal)" fill-opacity="0.18"/>
    <text x="1040" y="601" fill="#356C5D" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" text-anchor="middle">COVERAGE RECEIPT INCLUDED</text>
  </g>

  <circle cx="808" cy="360" r="16" fill="#A7F36B"/>
  <path d="M732 360H792" stroke="#A7F36B" stroke-width="3" stroke-dasharray="7 9"/>
  <path d="M824 360H875" stroke="#A7F36B" stroke-width="3" stroke-dasharray="7 9"/>
</svg>
