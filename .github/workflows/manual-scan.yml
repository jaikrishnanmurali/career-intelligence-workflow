name: Manual career-intelligence scan

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the digest through Resend
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the reference implementation
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: node --test

      - name: Run a bounded public demo
        if: ${{ inputs.send_email != true }}
        run: node scripts/smoke.mjs

      - name: Run and email a bounded demo
        if: ${{ inputs.send_email == true }}
        run: node src/run.mjs --send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CAREER_DIGEST_FROM: ${{ secrets.CAREER_DIGEST_FROM }}
          CAREER_DIGEST_TO: ${{ secrets.CAREER_DIGEST_TO }}
          ATS_BOARDS_PER_SOURCE: "25"
          MAX_SCAN_MINUTES: "5"
          MAX_PAGE_VERIFICATIONS: "12"

