name: Manual public project validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the public project
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run the complete fictional test suite
        run: npm test

      - name: Verify the installable package contents
        run: npm pack --dry-run

      - name: Confirm this workflow has no delivery credentials
        run: echo "Public validation completed. No live Career Ops scan ran and no email was sent."
